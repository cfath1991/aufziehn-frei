<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR_Code_Generator</title>
</head>

<body>
    <canvas id="canvas" width="150px" height="150px" style="background-color: beige;"></canvas>
</body>
<script>
    const qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="

    const canvas = document.getElementById("canvas")
    const ctx = canvas.getContext("2d")

    function run() {
        console.log("run...");

        importQrCode("https://aufziehn-frei.de")        
    }

    async function importQrCode(link) {
        console.log("importQrCode...");
        const url = qrApi + link;

        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "anonymous";

            img.onload = () => {
                try {
                    ctx.drawImage(img,0,0);
                    resolve();
                } catch (err) {
                    reject(new Error(`(importQRCode) Failed to draw image: ${err.message}`));
                }
            };

            img.onerror = () => {
                reject(new Error(`(importQRCode) Failed to load image from URL: ${url}`));
            };

            img.src = url;
        });
    }

    window.addEventListener("message", async (event) => {
        try {
            console.log(event);

            const link = event.data
            await importQrCode(link)

        } catch (error) {
            console.error(error, event);
        }
    });

    run()

</script>

</html>
