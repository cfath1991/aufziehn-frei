<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
    <div id="map" style="height: 700px; width: 800px;"></div>
</body>
<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

    window.onmessage = (event) => {
        console.log("[...new message in HTML2]", event);
        switchProgramms(event)
    };

    var map = L.map('map').setView([51.1657, 10.4515], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let layerGroups = [
        {
            title: "default",
            layer: L.layerGroup()
        }
    ]

    // Layer for concert locations
    var concertLayer = L.layerGroup();
    // Layer for customer locations
    var customerLayer = L.layerGroup();


    function switchProgramms(event) {
        console.log("[switchProgramms...]");

        switch (event.data.postName) {
            case "setMapView":
                setMapView(event.data.postValue)
                break;

            case "addToMap":
                addToMap(event.data.postValue)
                break;

            case "clearMap":
                clearMap()
                break;

            default:
                console.error("[ERROR: ...no function for postName: + " + event.data.postName + "]", event);
                break;
        }
    }

    function addToMap(data) {
        console.log("[addToMap...]", data);

        for (let i = 0; i < data.length; i++) {
            const entry = data[i];
            const layerTitle = entry.layer
            const lat = entry.lat;
            const lon = entry.lon;

            if (lat == undefined || lon == undefined) {
                console.error("ERROR: lat || lon ist undefined - continue");
                continue;
            }

            const icon = entry.customIcon ? L.icon(entry.customIcon) : undefined;
            let marker = L.marker([lat, lon], icon ? { icon } : {});

            marker.bindPopup(
                entry.popup_info
                + '<br><br><a href="#" id="' + entry.contactId + '">Kontakt bearbeiten</a>'
            );

            // --- popup open → attach click handler inside popup ---
            marker.on("popupopen", function () {
                const link = document.getElementById(entry.contactId);
                if (link) {
                    link.addEventListener("click", function (e) {
                        e.preventDefault();
                        const contactId = e.target.id;
                        console.log("[contactId: ", contactId + "]");

                        window.parent.postMessage(
                            { type: "editClicked", contactId },
                            "*"
                        );
                    });
                }
            });

            let layer = getLayerForTitle(layerTitle)

            marker.addTo(layer);
        }
        
        addLayersToMap()
    }

    function getLayerForTitle(title) {
        console.log("[getLayerForTitle...]");

        for (let i = 0; i < layerGroups.length; i++) {
            if (layerGroups[i].title === title) {
                return layerGroups[i].layer
            }
        }

        let newLayer = L.layerGroup()

        layerGroups.push(
            {
                title: title,
                layer: newLayer
            }
        )

        return newLayer
    }

    function addLayersToMap(){
        console.log("[addLayersToMap...]");
        
        for (let i = 0; i < layerGroups.length; i++) {
            const layer = layerGroups[i].layer;
            layer.addTo(map);
        }
    }

    function clearMap() {
        console.log("[clearMap...]");

        for (let i = 0; i < layerGroups.length; i++) {
            const layerGroup = layerGroups[i].layer;
            layerGroup.clearLayers()
        }
    }

    function setMapView(data) {
        console.log("setMapView...", data);
        map.setView([data.lat, data.lon], data.zoom)
    }



</script>

</html>
